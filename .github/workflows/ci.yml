name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend suite
        working-directory: backend
        run: python -m pytest -o addopts='' -q -p no:cacheprovider

  postgresql:
    name: PostgreSQL migration and lock smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aatm_test
          POSTGRES_USER: aatm_test
          POSTGRES_PASSWORD: aatm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aatm_test -d aatm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AATM_TEST_POSTGRES_URL: postgresql+psycopg://aatm_test:aatm_test@localhost:5432/aatm_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migrations and run lock
        working-directory: backend
        run: python -m pytest -o addopts='' -q -p no:cacheprovider tests/test_postgres_integration.py

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify frontend
        working-directory: web
        run: npm run verify
